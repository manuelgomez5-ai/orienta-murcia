name: Sincronizar CARM

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: orienta-murcia-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar lector PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Importar ranking si existe
        run: python scripts/import_ranking_xlsx.py
      - name: Sincronizar publicaciones oficiales
        run: python scripts/sync.py
      - name: Guardar cambios
        run: |
          git config user.name "orienta-murcia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos CARM: actualización automática"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar versión actualizada
        id: deployment
        uses: actions/deploy-pages@v4
